<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hitfactor USPSA Visualizer</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root {
      --bg: #020617;
      --panel: rgba(10, 20, 45, 0.92);
      --panel-2: rgba(30, 41, 59, 0.95);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: rgba(255,255,255,0.12);
      --danger: #f87171;
      --ok: #86efac;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(30,64,175,0.18), transparent 35%),
        linear-gradient(180deg, #020617 0%, #06112a 100%);
    }
    .app { max-width: 100%; margin: 0 auto; padding: 8px; display: grid; gap: 8px; min-height: 100vh; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
    }
    .chart-card { display: grid; grid-template-rows: auto auto auto 1fr auto; gap: 10px; min-height: calc(100vh - 16px); }
    .toolbar, .left-tools, .right-tools, .toggle-row, .legend, .selection-pills {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .legend { grid-row: 5; }
    .toolbar { justify-content: space-between; align-items: flex-end; }
    .tab-strip { gap: 0; align-items: flex-end; }
    .toggle-row { gap: 14px 18px; color: var(--muted); font-size: 14px; padding: 0 2px 2px 2px; }
    .switch-label {
      display: inline-flex; align-items: center; gap: 10px; margin: 0;
      font-size: 14px; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); cursor: pointer;
    }
    .switch-label input { position: absolute; opacity: 0; pointer-events: none; }
    .switch-ui {
      width: 42px; height: 24px; border-radius: 999px; position: relative; display: inline-block;
      background: rgba(255,255,255,0.14); border: 1px solid var(--border); transition: 0.18s ease;
      flex: 0 0 auto;
    }
    .switch-ui::after {
      content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px;
      border-radius: 999px; background: #e5e7eb; transition: 0.18s ease;
    }
    .switch-label input:checked + .switch-ui {
      background: rgba(37,99,235,0.5); border-color: rgba(96,165,250,0.7);
    }
    .switch-label input:checked + .switch-ui::after { transform: translateX(18px); background: #ffffff; }
    .tab-btn, button {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 14px;
      background: #334155;
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn {
      border-radius: 14px 14px 0 0;
      border-bottom-color: transparent;
      background: rgba(255,255,255,0.06);
      padding: 12px 16px;
      position: relative;
      top: 1px;
    }
    .tab-btn.active { background: linear-gradient(180deg, #16a34a, #166534); }
    button.primary { background: linear-gradient(180deg, #2563eb, #1d4ed8); }
    button.ghost { background: rgba(255,255,255,0.04); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .pill, .legend-item, .selection-pill {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
    }
    .pill { padding: 8px 12px; font-size: 13px; }
    .legend-item, .selection-pill { padding: 6px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
    .selection-pill button {
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      font-size: 12px;
    }
    .chart-wrap {
      position: relative;
      min-height: 0;
      border: 1px dashed rgba(255,255,255,0.10);
      border-radius: 18px;
      overflow: hidden;
      grid-row: 4;
    }
}
    .swatch { width: 10px; height: 10px; border-radius: 999px; display: inline-block; }
    .bottom-controls { display: grid; gap: 14px; margin-top: 8px; }
    .controls-grid { display: grid; grid-template-columns: 1fr 1fr auto auto auto; gap: 12px; align-items: end; }
    .add-grid { display: grid; grid-template-columns: 1.15fr 0.7fr auto; gap: 12px; align-items: end; }
    .top-add-grid { grid-template-columns: minmax(0, 1fr) minmax(140px, 0.48fr) auto; }
    .top-add-actions { display: flex; gap: 10px; align-items: end; flex-wrap: nowrap; }
    .top-add-actions > div { min-width: 0; }
    .date-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: end; }
    .date-grid > div, .target-row > div, .manual-grid > div, .top-add-grid > div, .add-grid > div { min-width: 0; }
    .card, .date-grid, .manual-grid, .top-add-grid, .top-add-actions { overflow: hidden; }
    .date-action-row { display: flex; gap: 12px; flex-wrap: nowrap; }
    .date-action-row button { flex: 0 0 auto; }
    .target-row { display: grid; grid-template-columns: minmax(180px, 320px); gap: 12px; align-items: end; }
    .date-field { min-width: 0; max-width: 100%; }
    .date-field input { width: 100%; max-width: 100%; }
    .manual-add-btn-wrap { display: flex; align-items: end; }
    .manual-add-btn-wrap button { min-width: 132px; }
    button.danger {
      background: linear-gradient(180deg, #b91c1c, #7f1d1d);
      border-color: rgba(248,113,113,0.35);
    }
    label {
      display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
    }
    input, select {
      width: 100%; max-width: 100%; min-width: 0; border-radius: 12px; border: 1px solid var(--border);
      background: var(--panel-2); color: var(--text); padding: 11px 12px; font: inherit;
    }
    input[type="date"] {
      box-sizing: border-box;
      overflow: hidden;
      -webkit-appearance: none;
      appearance: none;
      padding-right: 14px;
    }
    input[type="date"]::-webkit-date-and-time-value {
      text-align: left;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0.9;
      margin-left: 8px;
    }

    .status-text { min-height: 22px; color: var(--muted); }
    .status-text.error { color: var(--danger); }
    .status-text.ok { color: var(--ok); }
    .tooltip {
      position: absolute; pointer-events: none; background: rgba(2,6,23,0.96);
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
      font-size: 12px; color: var(--text); box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      opacity: 0; max-width: 340px; z-index: 20; line-height: 1.45; white-space: normal; word-break: break-word;
    }
    .empty {
      display: grid; place-items: center; color: var(--muted); text-align: center;
      padding: 24px; width: 100%; height: 100%;
    }
    .footer-note { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .whatif-panel {
      display: none;
      gap: 8px;
      padding: 10px 12px;
    }
    .whatif-panel-content {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 8px;
    }
    .whatif-card {
      background: rgba(2,6,23,0.72);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.35;
      min-width: 0;
    }
    svg text { fill: #cbd5e1; font-size: 12px; }
    .axis path, .axis line { stroke: rgba(255,255,255,0.15); }
    .grid line { stroke: rgba(255,255,255,0.08); }
    .grid path { stroke: none; }
    @media (max-width: 1080px) { .controls-grid, .add-grid, .manual-grid, .date-grid { grid-template-columns: 1fr 1fr !important; } }
    @media (max-width: 760px) {
      .toolbar { align-items: stretch; }
      .left-tools, .right-tools { width: 100%; }
      .controls-grid, .add-grid, .manual-grid, .date-grid, .top-add-grid { grid-template-columns: 1fr !important; }
      .top-add-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .card { padding: 10px; border-radius: 14px; }
      .chart-card { grid-template-rows: auto auto auto 1fr auto; min-height: auto; gap: 8px; }
      .tab-btn, button { padding: 9px 12px; font-size: 14px; }
      .toggle-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 12px;
        align-items: center;
      }
      .switch-label {
        white-space: normal;
        min-width: 0;
        font-size: 13px;
      }
      .legend {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 4px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .legend::-webkit-scrollbar { display: none; }
      .legend-item { flex: 0 0 auto; white-space: nowrap; }
      .selection-pills {
        display: grid;
        gap: 8px;
      }
      .selection-pill { width: 100%; white-space: normal; justify-content: space-between; }
      .date-action-row { display: grid; grid-template-columns: 1fr; gap: 12px; }
      .target-row { grid-template-columns: minmax(120px, 180px); }
      .manual-grid { grid-template-columns: 1fr !important; }
      input, select { min-height: 44px; font-size: 16px; width: 100%; max-width: 100%; }
      #manualClassifierCode, #manualHitfactor { font-variant-numeric: tabular-nums; }
      .tooltip { max-width: min(300px, calc(100vw - 28px)); font-size: 11px; }
      .whatif-panel { padding: 8px 10px; }
      .whatif-panel-content { grid-template-columns: 1fr; }
      .whatif-panel { order: 2; }
      .whatif-card { font-size: 11px; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card chart-card">
      <div class="toolbar">
        <div class="left-tools tab-strip">
          <button class="tab-btn active" data-tab="classifiers">Classifiers</button>
          <button class="tab-btn" data-tab="elo">ELO History</button>
        </div>
        <div class="right-tools">
          <div id="loadingState" class="pill">Loaded</div>
          <button id="shareBtn" class="ghost">Share view</button>
        </div>
      </div>

      <div class="toggle-row">
        <label class="switch-label"><input id="showPeakToggle" type="checkbox" checked /><span class="switch-ui"></span><span>Show Peak</span></label>
        <label class="switch-label"><input id="showPredictionToggle" type="checkbox" checked /><span class="switch-ui"></span><span>Show Prediction</span></label>
        <label class="switch-label"><input id="showClassifierScoresToggle" type="checkbox" /><span class="switch-ui"></span><span>Show Classifiers</span></label>
        <label class="switch-label"><input id="showWhatIfToggle" type="checkbox" checked /><span class="switch-ui"></span><span>Show What-if</span></label>
      </div>

      <div id="whatIfPanel" class="whatif-panel" style="display:none;"></div>

      <div id="chartContainer" class="chart-wrap"></div>
      <div id="legend" class="legend"></div>
    </div>

    <div class="card bottom-controls">
      <div class="add-grid top-add-grid">
        <div>
          <label for="shooterInput">Shooter</label>
          <input id="shooterInput" type="text" placeholder="Type a shooter name" />
        </div>
        <div>
          <label for="divisionSelect">Division</label>
          <select id="divisionSelect"></select>
        </div>
        <div class="top-add-actions">
          <div>
            <label>&nbsp;</label>
            <button id="addShooterBtn" class="primary">Add shooter</button>
          </div>
          <div>
            <label>&nbsp;</label>
            <button id="clearSelectionsBtn" class="danger">Clear shooters</button>
          </div>
        </div>
      </div>

            <div id="selectionPills" class="selection-pills"></div>
      <div id="statusText" class="status-text" style="display:none;" aria-live="polite"></div>

      <div class="date-grid">
        <div class="date-field">
          <label for="startDate">Beginning date</label>
          <input id="startDate" type="date" />
        </div>
        <div class="date-field">
          <label for="endDate">End date</label>
          <input id="endDate" type="date" />
        </div>
      </div>

      <div class="date-action-row">
        <button id="clearDatesBtn" class="ghost">Clear dates</button>
      </div>

      <div class="target-row">
        <div>
          <label for="targetClassifierCount">Calculate Scores Needed for Next Class</label>
          <select id="targetClassifierCount">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
          </select>
        </div>
      </div>

      <div class="card" style="padding:12px;">
        <div class="add-grid manual-grid" style="grid-template-columns: minmax(0,1.15fr) minmax(110px,0.7fr) minmax(110px,0.7fr) minmax(150px,0.85fr) auto;">
          <div>
            <label for="manualSelectionSelect">Add provisional classifier to</label>
            <select id="manualSelectionSelect"></select>
          </div>
          <div>
            <label for="manualClassifierCode">Classifier code</label>
            <input id="manualClassifierCode" type="text" placeholder="03-02" autocapitalize="off" autocomplete="off" spellcheck="false" pattern="[0-9-]*" maxlength="5" />
          </div>
          <div>
            <label for="manualHitfactor">Hit factor</label>
            <input id="manualHitfactor" type="number" min="0" step="0.01" placeholder="5.32" inputmode="decimal" />
          </div>
          <div class="date-field">
            <label for="manualClassifierDate">Date</label>
            <input id="manualClassifierDate" type="date" />
          </div>
          <div class="manual-add-btn-wrap">
            <label>&nbsp;</label>
            <button id="addManualClassifierBtn" class="primary">Add score</button>
          </div>
        </div>
        <div style="margin-top:12px;">
          <label>Manual scores</label>
          <div id="manualScorePills" class="selection-pills"></div>
        </div>
      </div>
      <div class="footer-note">
        Peak lines are flat lines at the all-time peak value for that shooter/division metric, using full history and clipped by the visible date range. Provisional classifier scores are local to your current session and immediately update the ranking line and What-if calculation.
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://floral-snow-9556.wwscoggin.workers.dev";
    
    function formatDivisionLabel(value) {
      return String(value || "").split("_").map(part => part.charAt(0).toUpperCase() + part.slice(1)).join(" ");
    }

    function normalizeDisplayName(name) {
      const trimmed = String(name || "").trim();
      if (!trimmed) return trimmed;
      return trimmed.split(/\s+/).map(part => part ? part.charAt(0).toUpperCase() + part.slice(1) : part).join(" ");
    }

    function formatSmartMonthYear(d, domain) {
      const start = domain[0];
      const end = domain[1];
      const spanYears = (end - start) / (1000 * 60 * 60 * 24 * 365.25);
      const month = d.getMonth();
      const yearShort = d3.timeFormat("%y")(d);
      const monthLabel = d3.timeFormat("%b")(d);

      if (spanYears >= 2) {
        if (![0, 3, 6, 9].includes(month)) return "";
        return `${monthLabel} '${yearShort}`;
      }
      if (spanYears >= 1) {
        if (![0, 2, 4, 6, 8, 10].includes(month)) return "";
        return `${monthLabel} '${yearShort}`;
      }
      return `${monthLabel} '${yearShort}`;
    }

    function getBottomAxisInterval() {
      if (window.innerWidth <= 480) return d3.timeMonth.every(4);
      if (window.innerWidth <= 760) return d3.timeMonth.every(3);
      return d3.timeMonth.every(1);
    }

    function formatMobileMonthYear(d) {
      return d3.timeFormat("%b '%y")(d);
    }

    function shouldUseTouchViewportLayout() {
      return window.matchMedia("(pointer: coarse)").matches || window.innerWidth <= 760;
    }

    function applyBottomAxis(g, x, xDomain) {
      const isMobile = shouldUseTouchViewportLayout();
      g.call(
        d3.axisBottom(x)
          .ticks(getBottomAxisInterval())
          .tickFormat(d => isMobile ? formatMobileMonthYear(d) : formatSmartMonthYear(d, xDomain))
      );

      if (isMobile) {
        g.selectAll("text")
          .style("text-anchor", "end")
          .attr("dx", "-0.35em")
          .attr("dy", "0.45em")
          .attr("transform", "rotate(-35)");
      }
    }

    function drawYearSeparators(svg, x, height, margin, dates) {
      if (!dates || !dates.length) return;
      const minDate = d3.min(dates);
      const maxDate = d3.max(dates);
      const years = d3.timeYear.range(
        d3.timeYear.floor(minDate),
        d3.timeYear.offset(d3.timeYear.ceil(maxDate), 1)
      ).filter(d => {
        const xPos = x(d);
        return xPos >= margin.left && xPos <= x.range()[1];
      });

      svg.append("g")
        .selectAll("line.year-sep")
        .data(years)
        .join("line")
        .attr("class", "year-sep")
        .attr("x1", d => x(d))
        .attr("x2", d => x(d))
        .attr("y1", margin.top)
        .attr("y2", height - margin.bottom)
        .attr("stroke", "rgba(255,255,255,0.35)")
        .attr("stroke-width", 2);
    }

    function seriesKey(selection) {
      return `${normalizeDisplayName(selection.name)} · ${selection.division}`;
    }

    function isSeriesFocused(key) {
      return state.focusedSeries === key;
    }

    function hasFocusedSeries() {
      return !!state.focusedSeries;
    }

    function toggleSeriesFocus(key) {
      state.focusedSeries = state.focusedSeries === key ? null : key;
      syncUrlState(true);
      render();
    }

    function getSeriesOpacity(key) {
      if (!hasFocusedSeries()) return 1;
      return isSeriesFocused(key) ? 1 : 1;
    }

    function getSeriesStrokeWidth(key, base = 2.5) {
      if (!hasFocusedSeries()) return base;
      return isSeriesFocused(key) ? base + 1.25 : Math.max(1, base - 0.75);
    }

    function getPointRadius(seriesCount) {
      return Math.max(1.5, 4 - seriesCount * 0.12);
    }

    function getRankPointRadius(seriesCount) {
      return Math.max(1.25, 2.6 - seriesCount * 0.08);
    }

    function allocateSeriesColor(key) {
      if (state.colorAssignments.has(key)) return state.colorAssignments.get(key);

      const palette = [
        "#22c55e",
        "#ef4444",
        "#4e79a7",
        "#f28e2b",
        "#e15759",
        "#76b7b2",
        "#59a14f",
        "#edc948",
        "#b07aa1",
        "#ff9da7",
        "#9c755f",
        "#bab0ab",
        "#8dd3c7",
        "#80b1d3",
        "#fdb462",
        "#b3de69",
        "#fccde5",
        "#bc80bd"
      ];

      const used = new Set(state.colorAssignments.values());
      const chosen = palette.find(c => !used.has(c)) || palette[state.colorAssignments.size % palette.length];
      state.colorAssignments.set(key, chosen);
      return chosen;
    }

    function normalizeDisplayName(name) {
      const trimmed = String(name || "").trim();
      if (!trimmed) return trimmed;
      return trimmed
        .split(/\s+/)
        .map(part => part ? part.charAt(0).toUpperCase() + part.slice(1) : part)
        .join(" ");
    }

    const divisions = [
      "carry_optics","limited","limited_10","limited_optics","open","pcc","production","revolver","single_stack"
    ].sort((a, b) => formatDivisionLabel(a).localeCompare(formatDivisionLabel(b)));

    const state = {
      activeTab: "classifiers",
      startDate: "",
      endDate: "",
      selections: [],
      cache: new Map(),
      chartHeight: null,
      showPeak: true,
      showPrediction: true,
      showClassifierScores: false,
      showWhatIf: true,
      focusedSeries: null,
      colorAssignments: new Map(),
      targetClassifierCount: 4,
      mobileChartHeight: null,
      mobileOrientation: null,
      pendingManualScores: []
    };

    const els = {
      divisionSelect: document.getElementById("divisionSelect"),
      startDate: document.getElementById("startDate"),
      endDate: document.getElementById("endDate"),
      shooterInput: document.getElementById("shooterInput"),
      addShooterBtn: document.getElementById("addShooterBtn"),
      clearDatesBtn: document.getElementById("clearDatesBtn"),
      clearSelectionsBtn: document.getElementById("clearSelectionsBtn"),
      shareBtn: document.getElementById("shareBtn"),
      loadingState: document.getElementById("loadingState"),
      chartContainer: document.getElementById("chartContainer"),
      statusText: document.getElementById("statusText"),
      selectionPills: document.getElementById("selectionPills"),
      legend: document.getElementById("legend"),
      whatIfPanel: document.getElementById("whatIfPanel"),
      showPeakToggle: document.getElementById("showPeakToggle"),
      showPredictionToggle: document.getElementById("showPredictionToggle"),
      showClassifierScoresToggle: document.getElementById("showClassifierScoresToggle"),
      showWhatIfToggle: document.getElementById("showWhatIfToggle"),
      targetClassifierCount: document.getElementById("targetClassifierCount"),
      manualSelectionSelect: document.getElementById("manualSelectionSelect"),
      manualClassifierCode: document.getElementById("manualClassifierCode"),
      manualHitfactor: document.getElementById("manualHitfactor"),
      manualClassifierDate: document.getElementById("manualClassifierDate"),
      addManualClassifierBtn: document.getElementById("addManualClassifierBtn"),
      manualScorePills: document.getElementById("manualScorePills")
    };

    function initControls() {
      divisions.forEach(div => {
        const option = document.createElement("option");
        option.value = div;
        option.textContent = formatDivisionLabel(div);
        els.divisionSelect.appendChild(option);
      });
      els.divisionSelect.value = "carry_optics";

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === state.activeTab);
        btn.addEventListener("click", () => {
          state.activeTab = btn.dataset.tab;
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b === btn));
          syncUrlState(true);
          render();
        });
      });

      els.startDate.addEventListener("change", () => { state.startDate = els.startDate.value; syncUrlState(true); render(); });
      els.endDate.addEventListener("change", () => { state.endDate = els.endDate.value; syncUrlState(true); render(); });

      els.clearDatesBtn.addEventListener("click", () => {
        state.startDate = "";
        state.endDate = "";
        els.startDate.value = "";
        els.endDate.value = "";
        syncUrlState(true);
        render();
      });

      els.clearSelectionsBtn.addEventListener("click", () => {
        state.selections = [];
        state.focusedSeries = null;
        renderSelections();
        syncUrlState(true);
        render();
        flashStatus("Cleared shooter selections.");
      });

      els.addShooterBtn.addEventListener("click", addShooterSelection);
      els.shooterInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          addShooterSelection();
        }
      });

      els.shareBtn.addEventListener("click", shareCurrentView);
      els.showPeakToggle.addEventListener("change", () => { state.showPeak = els.showPeakToggle.checked; syncUrlState(true); render(); });
      els.showPredictionToggle.addEventListener("change", () => { state.showPrediction = els.showPredictionToggle.checked; syncUrlState(true); render(); });
      els.showWhatIfToggle.addEventListener("change", () => { state.showWhatIf = els.showWhatIfToggle.checked; syncUrlState(true); render(); });
      els.showClassifierScoresToggle.addEventListener("change", () => {
        state.showClassifierScores = els.showClassifierScoresToggle.checked;
        syncUrlState(true);
        render();
      });
      els.targetClassifierCount.addEventListener("change", () => {
        state.targetClassifierCount = Math.max(1, Number(els.targetClassifierCount.value || 4) || 4);
        els.targetClassifierCount.value = state.targetClassifierCount;
        syncUrlState(true);
        render();
      });
      els.targetClassifierCount.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          state.targetClassifierCount = Math.max(1, Number(els.targetClassifierCount.value || 4) || 4);
          els.targetClassifierCount.value = state.targetClassifierCount;
          syncUrlState(true);
          render();
        }
      });
      if (els.manualClassifierCode) {
        els.manualClassifierCode.addEventListener("input", () => {
          els.manualClassifierCode.value = els.manualClassifierCode.value.replace(/[^0-9-]/g, "").slice(0, 5);
        });
      }
      if (els.addManualClassifierBtn) {
        els.addManualClassifierBtn.addEventListener("click", addManualClassifier);
