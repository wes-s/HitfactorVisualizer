      if (els.manualHitfactor) {
        els.manualHitfactor.addEventListener("keydown", event => {
          if (event.key === "Enter") {
            event.preventDefault();
            addManualClassifier();
          }
        });
      }
      if (els.manualClassifierDate && !els.manualClassifierDate.value) {
        els.manualClassifierDate.value = new Date().toISOString().slice(0, 10);
      }

      applyUrlState();
      renderSelections();
      initChartHeight(true);
    }

    function initChartHeight(force = false) {
      const chartCard = document.querySelector(".chart-card");
      const chartCardRect = chartCard.getBoundingClientRect();
      const toolbar = chartCard.querySelector(".toolbar");
      const toggleRow = chartCard.querySelector(".toggle-row");
      const toolbarH = toolbar ? toolbar.getBoundingClientRect().height : 0;
      const toggleH = toggleRow ? toggleRow.getBoundingClientRect().height : 0;
      const legendH = Math.max(36, els.legend.getBoundingClientRect().height || 36);
      const shouldLockChartHeight = shouldUseTouchViewportLayout();

      if (shouldLockChartHeight) {
        const orientation = window.innerWidth > window.innerHeight ? "landscape" : "portrait";
        if (force || !state.mobileChartHeight || !state.mobileOrientation || state.mobileOrientation !== orientation) {
          const stableViewportHeight = Math.max(
            window.screen?.height || 0,
            window.innerHeight || 0,
            document.documentElement.clientHeight || 0
          );
          const reserved = toolbarH + toggleH + legendH + 120;
          state.mobileChartHeight = Math.max(320, Math.min(520, stableViewportHeight - reserved));
          state.mobileOrientation = orientation;
        }
        state.chartHeight = state.mobileChartHeight;
        els.chartContainer.style.height = `${state.chartHeight}px`;

        const bottomControls = document.querySelector(".bottom-controls");
        if (bottomControls) bottomControls.style.marginTop = "8px";
        return;
      }

      const viewportHeight = document.documentElement.clientHeight || window.innerHeight;
      const cardVerticalPadding = 44;
      const minHeight = 420;
      const available = viewportHeight - chartCardRect.top - toolbarH - toggleH - legendH - cardVerticalPadding;
      state.chartHeight = Math.max(minHeight, available);
      els.chartContainer.style.height = `${state.chartHeight}px`;

      const bottomControls = document.querySelector(".bottom-controls");
      if (bottomControls) {
        const cardBottom = chartCard.getBoundingClientRect().bottom;
        bottomControls.style.marginTop = `${Math.max(8, viewportHeight - cardBottom + 24)}px`;
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`${response.status} ${response.statusText} for ${url}`);
      return response.json();
    }

    function flashStatus(message, kind = "") {
      if (!els.statusText) return;
      els.statusText.textContent = message || "";
      els.statusText.className = ["status-text", kind].filter(Boolean).join(" ");
      els.statusText.style.display = message ? "block" : "none";
    }

    function setLoading(isLoading, label = "Loaded") {
      if (els.loadingState) {
        els.loadingState.textContent = label || (isLoading ? "Loading..." : "Loaded");
        els.loadingState.style.background = isLoading ? "linear-gradient(180deg, #7c3aed, #5b21b6)" : "rgba(255,255,255,0.06)";
      }
      els.addShooterBtn.disabled = isLoading;
      if (els.addManualClassifierBtn) els.addManualClassifierBtn.disabled = isLoading;
    }

    function normalizeDivision(value) {
      return String(value || "").toLowerCase().replace(/\s+/g, "_").replace(/-/g, "_");
    }

    function findArrayDeep(value, preferredKeys = []) {
      if (Array.isArray(value)) return value;
      if (!value || typeof value !== "object") return [];
      for (const key of preferredKeys) if (Array.isArray(value[key])) return value[key];
      for (const nested of Object.values(value)) if (Array.isArray(nested)) return nested;
      return [];
    }

    function parseDateValue(row) {
      const keys = ["match_date","date","shot_date","event_date","timestamp","rated_at","created_at","last_match_date"];
      for (const key of keys) {
        if (row && row[key]) {
          const d = new Date(row[key]);
          if (!Number.isNaN(d.getTime())) return d;
        }
      }
      return null;
    }

    function compareClassifierChronology(a, b) {
      const dateDiff = a.date - b.date;
      if (dateDiff !== 0) return dateDiff;

      const aHhf = Number.isFinite(Number(a?.hhfPct)) ? Number(a.hhfPct) : Number.NEGATIVE_INFINITY;
      const bHhf = Number.isFinite(Number(b?.hhfPct)) ? Number(b.hhfPct) : Number.NEGATIVE_INFINITY;
      if (aHhf !== bHhf) return aHhf - bHhf;

      return (Number(a?.idx) || 0) - (Number(b?.idx) || 0);
    }

    function pickNumber(row, candidates) {
      for (const key of candidates) {
        const n = Number(row?.[key]);
        if (!Number.isNaN(n)) return n;
      }
      return null;
    }

    function pickNumberDeep(row, candidates) {
      const direct = pickNumber(row, candidates);
      if (direct !== null) return direct;
      if (!row || typeof row !== "object") return null;

      for (const value of Object.values(row)) {
        if (value && typeof value === "object" && !Array.isArray(value)) {
          const nested = pickNumber(value, candidates);
          if (nested !== null) return nested;
        }
      }
      return null;
    }

    function extractClassifierHitFactor(row) {
      return pickNumberDeep(row, [
        "hit_factor","hitfactor","hf","hitFactor","score_hf","stage_hf",
        "hit_factor_score","scored_hit_factor","hitFactorScore","factor",
        "score","points_factor"
      ]);
    }

    function extractClassifierHHFValue(row) {
      return pickNumberDeep(row, [
        "hhf","hhf_value","high_hit_factor","highHitFactor","hhfValue"
      ]);
    }

    function fuzzyScore(query, candidate) {
      const q = query.toLowerCase();
      const c = candidate.toLowerCase();
      if (q === c) return 100;
      if (c.startsWith(q)) return 90;
      if (c.includes(q)) return 75;
      return q.split(/\s+/).filter(part => c.includes(part)).length * 10;
    }

    function pickBestShooter(query, results) {
      if (!Array.isArray(results) || !results.length) return null;
      return [...results].sort((a, b) => {
        const aName = a.name || a.shooter_name || "";
        const bName = b.name || b.shooter_name || "";
        return fuzzyScore(query, bName) - fuzzyScore(query, aName);
      })[0];
    }

    function parseEloHistory(payload, shooterMeta, division) {
      const history = findArrayDeep(payload, ["history"]);
      const targetDivision = normalizeDivision(division);
      return history.map((row, idx) => ({
        shooterId: shooterMeta.id,
        shooterName: shooterMeta.name,
        division: normalizeDivision(row.division || division),
        date: parseDateValue(row),
        rating: pickNumber(row, ["rating_after","display_rating","rating"]),
        ratingBefore: pickNumber(row, ["rating_before"]),
        sigma: pickNumber(row, ["sigma_after","sigma_before","sigma"]),
        matchPct: pickNumber(row, ["match_pct"]),
        matchName: row.match_name || "",
        idx
      })).filter(d => d.date && d.rating !== null && d.division === targetDivision)
        .sort(compareClassifierChronology);
    }

    function parseClassifiers(payload, shooterMeta, division) {
      const rows = findArrayDeep(payload, ["classifiers","scores","history","items"]);
      const targetDivision = normalizeDivision(division);
      return rows.map((row, idx) => {
        const hhfPct = pickNumber(row, ["hhf_pct","hhfPercent","percentage","pct"]);
        const hitfactor = extractClassifierHitFactor(row);
        const hhfValue = extractClassifierHHFValue(row);
        const derivedHitfactor = Number.isFinite(hitfactor)
          ? hitfactor
          : (Number.isFinite(hhfPct) && Number.isFinite(hhfValue) ? (hhfPct * hhfValue / 100) : null);

        return {
          shooterId: shooterMeta.id,
          shooterName: shooterMeta.name,
          division: normalizeDivision(row.division || division),
          date: parseDateValue(row),
          hhfPct,
          hitfactor: derivedHitfactor,
          hhfValue,
          code: String(row.code || row.classifier_code || row.classifier || row.stage_code || row.name || `classifier_${idx}`),
          classifierName: row.classifier_name || row.name || row.title || "",
          matchName: row.match_name || row.event_name || "",
          idx
        };
      }).filter(d => d.date && d.hhfPct !== null && d.division === targetDivision)
        .sort(compareClassifierChronology);
    }

    function filterByDate(rows) {
      const start = state.startDate ? new Date(`${state.startDate}T00:00:00`) : null;
      const end = state.endDate ? new Date(`${state.endDate}T23:59:59`) : null;
      return rows.filter(row => (!start || row.date >= start) && (!end || row.date <= end));
    }

    function computeRollingRankings(classifiers) {
      const sorted = [...classifiers].sort(compareClassifierChronology);
      const latestByCode = new Map();
      const points = [];
      for (const row of sorted) {
        latestByCode.set(row.code, row);
        const valid = [...latestByCode.values()].sort((a, b) => compareClassifierChronology(b, a));
        const lastEight = valid.slice(0, 8);
        const bestSix = [...lastEight].sort((a, b) => b.hhfPct - a.hhfPct).slice(0, 6);
        const average = bestSix.length >= 4 ? bestSix.reduce((sum, item) => sum + item.hhfPct, 0) / bestSix.length : null;
        points.push({ shooterId: row.shooterId, shooterName: row.shooterName, division: row.division, date: row.date, ranking: average });
      }
      return points.filter(d => d.ranking !== null);
    }

    function getPeakLevel(values, valueKey) {
      if (!values.length) return null;
      return d3.max(values, d => d[valueKey]);
    }

    function buildFlatPeakLine(values, valueKey) {
      if (!values.length) return [];
      const peak = getPeakLevel(values, valueKey);
      return peak === null ? [] : values.map(d => ({ date: d.date, value: peak }));
    }

    
    const CLASS_LINES = [
      { pct: 40, label: "C" },
      { pct: 60, label: "B" },
      { pct: 75, label: "A" },
      { pct: 85, label: "M" },
      { pct: 95, label: "GM" }
    ];

    function getCurrentClassification(pct) {
      if (!Number.isFinite(pct)) return null;
      if (pct >= 95) return "GM";
      if (pct >= 85) return "M";
      if (pct >= 75) return "A";
      if (pct >= 60) return "B";
      if (pct >= 40) return "C";
      return "U";
    }

    function getNextClassificationThresholdFromClass(cls) {
      if (cls === "U") return { label: "C", threshold: 40 };
      if (cls === "C") return { label: "B", threshold: 60 };
      if (cls === "B") return { label: "A", threshold: 75 };
      if (cls === "A") return { label: "M", threshold: 85 };
      if (cls === "M") return { label: "GM", threshold: 95 };
      return null;
    }

    function getClassificationRank(cls) {
      return { U: 0, C: 1, B: 2, A: 3, M: 4, GM: 5 }[cls] ?? -1;
    }

    function getMoreAdvancedClass(a, b) {
      return getClassificationRank(a) >= getClassificationRank(b) ? a : b;
    }

    function computeCurrentBestSixWindow(classifiers) {
      const sorted = [...classifiers].sort(compareClassifierChronology);
      const latestByCode = new Map();
      for (const row of sorted) latestByCode.set(row.code, row);

      const valid = [...latestByCode.values()].sort((a, b) => compareClassifierChronology(b, a));
      const lastEight = valid.slice(0, 8);
      const rankedLastEight = [...lastEight].sort((a, b) => {
        const pctDiff = b.hhfPct - a.hhfPct;
        if (pctDiff !== 0) return pctDiff;
        return compareClassifierChronology(b, a);
      });
      const bestSix = rankedLastEight.slice(0, 6);
      const thrownOutLowest = rankedLastEight.slice(6).sort((a, b) => compareClassifierChronology(a, b));

      return {
        currentRanking: bestSix.length >= 4 ? d3.mean(bestSix, d => d.hhfPct) : null,
        bestSix,
        thrownOutLowest,
        lastEight,
        latestByCode
      };
    }

    function getSupersededClassifierPoints(classifiers) {
      const sorted = [...classifiers].sort(compareClassifierChronology);
      const latestIndexByCode = new Map();
      sorted.forEach((row, i) => latestIndexByCode.set(row.code, i));
      return sorted.filter((row, i) => latestIndexByCode.get(row.code) !== i);
    }

    function isCurrentCalcPoint(classifiers, row) {
      const currentState = computeCurrentBestSixWindow(classifiers);
      return (currentState.bestSix || []).some(item =>
        item.code === row.code &&
        item.idx === row.idx &&
        item.date.getTime() === row.date.getTime()
      );
    }

    function computeClassifierCalcState(classifiers) {
      const sorted = [...classifiers].sort(compareClassifierChronology);

      const latestByCode = new Map();
      for (const row of sorted) latestByCode.set(row.code, row);

      const valid = [...latestByCode.values()].sort((a, b) => compareClassifierChronology(b, a));
      const lastEightValid = valid.slice(0, 8);
      const lastEightCodes = new Set(lastEightValid.map(d => d.code));
      const earliestValidDate = lastEightValid.length
        ? Math.min(...lastEightValid.map(d => d.date.getTime()))
        : null;

      const removedFromCurrentCalc = sorted
        .filter(row => {
          if (!lastEightCodes.has(row.code)) return false;
          if (latestByCode.get(row.code) === row) return false;
          if (earliestValidDate == null) return false;
          return row.date.getTime() >= earliestValidDate;
        })
        .map(row => ({
          ...row,
          removedFromCurrentCalc: true,
          replacedBy: latestByCode.get(row.code)
        }));

      return {
        latestByCode,
        lastEightValid,
        removedFromCurrentCalc
      };
    }

    function findRemovedClassifierState(classifiers, row) {
      const calcState = computeClassifierCalcState(classifiers);
      return calcState.removedFromCurrentCalc.find(d =>
        d.code === row.code &&
        d.idx === row.idx &&
        d.date.getTime() === row.date.getTime()
      ) || null;
    }

    function requiredAverageForNextClass(sel, nToAdd = 4) {
      const classifiers = sel.classifiers || [];
      const rankingHistory = sel.rankingHistory || [];
      const currentState = computeCurrentBestSixWindow(classifiers);
      const current = currentState.currentRanking;
      const peakRanking = (rankingHistory && rankingHistory.length) ? d3.max(rankingHistory, d => d.ranking) : current;
      const peakClass = getCurrentClassification(peakRanking);
      const currentPctClass = getCurrentClassification(current);
      const officialCurrentClass = sel.currentClassification || null;

      const effectiveCurrentClass = getMoreAdvancedClass(
        officialCurrentClass || "U",
        currentPctClass || "U"
      );
      const next = getNextClassificationThresholdFromClass(effectiveCurrentClass);

      if (!next) {
        return {
          currentRanking: current,
          currentPctClass,
          currentOfficialClass: officialCurrentClass,
          effectiveCurrentClass,
          peakRanking,
          peakClass,
          nextClass: null,
          superseded: getSupersededClassifierPoints(classifiers)
        };
      }

      const baseScores = currentState.bestSix.map(d => Math.max(0, d.hhfPct)).sort((a, b) => b - a);
      const n = Math.max(1, Number(nToAdd) || 1);

      let lo = 0;
      let hi = 130;
      let feasible = false;

      for (let i = 0; i < 40; i++) {
        const mid = (lo + hi) / 2;
        const combined = baseScores.concat(Array(n).fill(Math.max(0, mid))).sort((a, b) => b - a).slice(0, 6);
        const avg = d3.mean(combined);
        if (avg >= next.threshold) {
          feasible = true;
          hi = mid;
        } else {
          lo = mid;
        }
      }

      return {
        currentRanking: current,
        currentPctClass,
        currentOfficialClass: officialCurrentClass,
        effectiveCurrentClass,
        peakRanking,
        peakClass,
        nextClass: next.label,
        nextThreshold: next.threshold,
        nToAdd: n,
        requiredAverage: feasible ? hi : null,
        superseded: getSupersededClassifierPoints(classifiers)
      };
    }
    function drawClassLines(svg, y, width, margin) {
      const g = svg.append("g");
      CLASS_LINES.forEach(line => {
        g.append("line")
          .attr("x1", margin.left)
          .attr("x2", width - margin.right)
          .attr("y1", y(line.pct))
          .attr("y2", y(line.pct))
          .attr("stroke", "rgba(255,255,255,0.18)")
          .attr("stroke-width", 1);
      });
    }

    function drawRightClassAxis(svg, y, width, margin) {
      const axis = d3.axisRight(y)
        .tickValues(CLASS_LINES.map(d => d.pct))
        .tickFormat(v => {
          const match = CLASS_LINES.find(d => d.pct === v);
          return match ? match.label : "";
        });

      svg.append("g")
        .attr("class", "axis")
        .attr("transform", `translate(${width - margin.right},0)`)
        .call(axis);
    }

    function solveLinearSystem(matrix, vector) {
      const n = matrix.length;
      const a = matrix.map((row, i) => [...row, vector[i]]);

      for (let col = 0; col < n; col++) {
        let pivot = col;
        for (let r = col + 1; r < n; r++) {
          if (Math.abs(a[r][col]) > Math.abs(a[pivot][col])) pivot = r;
        }
        if (Math.abs(a[pivot][col]) < 1e-12) return null;
        if (pivot !== col) [a[col], a[pivot]] = [a[pivot], a[col]];

        const scale = a[col][col];
        for (let j = col; j <= n; j++) a[col][j] /= scale;

        for (let r = 0; r < n; r++) {
          if (r === col) continue;
          const factor = a[r][col];
          for (let j = col; j <= n; j++) {
            a[r][j] -= factor * a[col][j];
          }
        }
      }

      return a.map(row => row[n]);
    }

    function weightedLinearFit(xs, ys, weights) {
      let sw = 0, sx = 0, sy = 0, sxx = 0, sxy = 0;
      for (let i = 0; i < xs.length; i++) {
        const w = weights[i];
        const x = xs[i];
        const y = ys[i];
        sw += w;
        sx += w * x;
        sy += w * y;
        sxx += w * x * x;
        sxy += w * x * y;
      }
      const denom = sw * sxx - sx * sx;
      if (Math.abs(denom) < 1e-12) return null;
      const slope = (sw * sxy - sx * sy) / denom;
      const intercept = (sy - slope * sx) / sw;
      return { slope, intercept };
    }

    function polynomialPrediction(values, key, monthsForward = 12, degree = 5, halfLifeMonths = 12) {
      const sortedValues = values
        .filter(d => d?.date instanceof Date && Number.isFinite(d[key]))
        .sort((a, b) => a.date - b.date);

      if (sortedValues.length < 3) return [];

      const latestDate = sortedValues[sortedValues.length - 1].date;
      const cutoff = new Date(latestDate);
      cutoff.setFullYear(cutoff.getFullYear() - 2);

      const data = sortedValues.filter(d => d.date >= cutoff);
      if (data.length < 3) return [];

      const recentCount = key === "rating" ? data.length : Math.min(8, data.length);
      const recent = data.slice(-recentCount);

      const t0 = recent[0].date.getTime();
      const msPerMonth = 1000 * 60 * 60 * 24 * 30.4375;

      const xs = recent.map(d => (d.date.getTime() - t0) / msPerMonth);
      const ys = recent.map(d => d[key]);
      const halfLife = Math.max(0.5, halfLifeMonths);
      const weights = recent.map((d, i) => {
        const ageMonths = (recent[recent.length - 1].date.getTime() - d.date.getTime()) / msPerMonth;
        const recency = Math.pow(0.5, ageMonths / halfLife);
        const base = 1 + (i / Math.max(1, recent.length - 1)) * 0.35;
        return recency * base;
      });

      const fit = weightedLinearFit(xs, ys, weights);
      if (!fit) return [];

      const maxMonthlySlope = key === "rating" ? 12 : 1.25;
      const clampedSlope = Math.max(-maxMonthlySlope, Math.min(maxMonthlySlope, fit.slope));

      const recentVals = recent.map(d => d[key]);
      const recentMin = Math.min(...recentVals);
      const recentMax = Math.max(...recentVals);
      const recentRange = Math.max(1, recentMax - recentMin);

      const historicalFit = recent.map(d => {
        const x = (d.date.getTime() - t0) / msPerMonth;
        let value = fit.intercept + clampedSlope * x;
        if (key === "ranking" || key === "hhfPct") {
          value = Math.max(0, Math.min(120, value));
        } else if (key === "rating") {
          value = Math.max(0, value);
        }
        return { date: d.date, value, isProjected: false };
      });

      const latest = recent[recent.length - 1];
      const projected = [];
      for (let m = 1; m <= monthsForward; m++) {
        const date = new Date(latest.date);
        date.setMonth(date.getMonth() + m);

        let value = latest[key] + clampedSlope * m;

        if (key === "ranking" || key === "hhfPct") {
          const upper = Math.min(100, recentMax + Math.max(6, recentRange * 0.8));
          const lower = 0;

          // soft clamp instead of hard cap
          if (value > upper) {
            const excess = value - upper;
            value = upper + excess * 0.25; // allow some continued growth
          }
          if (value < lower) value = lower;
        } else if (key === "rating") {
          const pad = Math.max(25, recentRange);
          value = Math.max(0, Math.min(recentMax + pad, value));
        }

        projected.push({ date, value, isProjected: true });
      }

      return historicalFit.concat(projected);
    }

    async function resolveShooter(query) {
      const result = await fetchJson(`${API_BASE}/v1/shooters?q=${encodeURIComponent(query)}`);
      const candidates = Array.isArray(result) ? result : findArrayDeep(result, ["items","shooters","results"]);
      const match = pickBestShooter(query, candidates);
      if (!match) throw new Error(`No shooter found for "${query}"`);

      const derivedName = (
        match.name ||
        match.shooter_name ||
        match.full_name ||
        match.display_name ||
        [match.first_name, match.last_name].filter(Boolean).join(" ").trim() ||
        [match.firstname, match.lastname].filter(Boolean).join(" ").trim() ||
        query
      );

      return {
        id: match.id || match.identifier || match.shooter_id || match.identity_id,
        name: derivedName,
        memberNumber: match.member_number || match.memberNumber || match.uspsa_number || ""
      };
    }

    async function loadShooterDivisionBundle(selection) {
      const key = `${selection.id}:${selection.division}`;
      if (state.cache.has(key)) return state.cache.get(key);
      const [eloPayload, classifierPayload, matchPayload] = await Promise.all([
        fetchJson(`${API_BASE}/v1/shooters/${selection.id}/elo`),
        fetchJson(`${API_BASE}/v1/shooters/${selection.id}/classifiers`),
        fetchJson(`${API_BASE}/v1/shooters/${selection.id}/matches`)
      ]);
      const fullClassifierHistory = parseClassifiers(classifierPayload, selection, selection.division);
      const targetDivision = normalizeDivision(selection.division);

      const latestDivisionMatch = findArrayDeep(matchPayload, ["data"])
        .map(row => ({
          ...row,
          division: normalizeDivision(row.division),
          matchDate: row.match_date ? new Date(row.match_date) : parseDateValue(row)
        }))
        .filter(row => row.matchDate && row.division === targetDivision)
        .sort((a, b) => b.matchDate - a.matchDate)[0] || null;

      const currentClassification = latestDivisionMatch?.classification || null;

      const bundle = {
        ...selection,
        division: targetDivision,
        eloHistory: parseEloHistory(eloPayload, selection, selection.division),
        classifiers: fullClassifierHistory,
        rankingHistory: computeRollingRankings(fullClassifierHistory),
        currentClassification
      };
      state.cache.set(key, bundle);
      return bundle;
    }

    async function addShooterSelection() {
      const query = els.shooterInput.value.trim();
      const division = normalizeDivision(els.divisionSelect.value);
      if (!query) {
        flashStatus("Enter a shooter name.", "error");
        return;
      }

      setLoading(true, "Resolving shooter...");
      flashStatus("Resolving shooter and loading selected division...");
      try {
        const shooter = await resolveShooter(query);
        const duplicate = state.selections.find(sel => String(sel.id) === String(shooter.id) && sel.division === division);
        if (duplicate) {
          flashStatus("That shooter/division pair is already loaded.", "error");
          return;
        }

        const selection = {
          id: shooter.id,
          name: shooter.name,
          memberNumber: shooter.memberNumber,
          division
        };
        const bundle = await loadShooterDivisionBundle(selection);
        state.selections.push(bundle);
        els.shooterInput.value = "";
        renderSelections();
        syncUrlState(true);
        render();
        flashStatus(`Added ${normalizeDisplayName(bundle.name)} · ${formatDivisionLabel(bundle.division)}.`, "ok");
      } catch (error) {
        console.error(error);
        flashStatus(String(error.message || error), "error");
      } finally {
        setLoading(false, "Loaded");
      }
    }

    function removeSelection(index) {
      const removed = state.selections[index];
      if (removed && state.focusedSeries === seriesKey(removed)) {
        state.focusedSeries = null;
      }
      state.selections.splice(index, 1);
      renderSelections();
      syncUrlState(true);
      render();
    }

    function renderSelections() {
      els.selectionPills.innerHTML = "";
      state.selections.forEach((sel, index) => {
        const pill = document.createElement("div");
        pill.className = "selection-pill";
        pill.innerHTML = `<span>${normalizeDisplayName(sel.name)} · ${formatDivisionLabel(sel.division)}${sel.memberNumber ? ` · ${sel.memberNumber}` : ""}</span>`;
        const btn = document.createElement("button");
        btn.textContent = "Remove";
        btn.addEventListener("click", () => removeSelection(index));
        pill.appendChild(btn);
        els.selectionPills.appendChild(pill);
      });
      renderManualSelectionOptions();
      renderManualScorePills();
    }

    function renderManualSelectionOptions() {
      if (!els.manualSelectionSelect) return;
      const currentValue = els.manualSelectionSelect.value;
      els.manualSelectionSelect.innerHTML = "";

      if (!state.selections.length) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "Add a shooter/division first";
        els.manualSelectionSelect.appendChild(option);
        els.manualSelectionSelect.disabled = true;
        if (els.addManualClassifierBtn) els.addManualClassifierBtn.disabled = true;
        return;
      }

      els.manualSelectionSelect.disabled = false;
      if (els.addManualClassifierBtn) els.addManualClassifierBtn.disabled = false;

      state.selections.forEach(sel => {
        const option = document.createElement("option");
        option.value = `${sel.id}:${sel.division}`;
        option.textContent = `${normalizeDisplayName(sel.name)} · ${formatDivisionLabel(sel.division)}`;
        els.manualSelectionSelect.appendChild(option);
      });

      if (currentValue && [...els.manualSelectionSelect.options].some(opt => opt.value === currentValue)) {
        els.manualSelectionSelect.value = currentValue;
      }
    }

    function findSelectionByBundleKey(bundleKey) {
      return state.selections.find(sel => `${sel.id}:${sel.division}` === bundleKey) || null;
    }

    function serializeManualScores() {
      const entries = [];
      state.selections.forEach(sel => {
        (sel.classifiers || []).filter(row => row.isManual).forEach(row => {
          entries.push([
            encodeURIComponent(String(sel.id || "")),
            encodeURIComponent(normalizeDivision(sel.division)),
            encodeURIComponent(String(row.code || "")),
            encodeURIComponent(String(row.manualHitfactor ?? "")),
            encodeURIComponent(row.date instanceof Date ? row.date.toISOString().slice(0, 10) : ""),
            encodeURIComponent(String(row.hhfPct ?? "")),
            encodeURIComponent(String(row.hhfValue ?? "")),
            encodeURIComponent(String(row.classifierName || ""))
          ].join("~"));
        });
      });
      return entries.join("|");
    }

    function reapplyManualScoresFromUrl() {
      const pending = state.pendingManualScores || [];
      if (!pending.length) return;

      pending.forEach(item => {
        const selection = state.selections.find(sel =>
          String(sel.id) === String(item.id) && normalizeDivision(sel.division) === normalizeDivision(item.division)
        );
        if (!selection) return;

        const manualDate = new Date(`${item.date}T12:00:00`);
        if (Number.isNaN(manualDate.getTime())) return;

        const duplicate = (selection.classifiers || []).some(row =>
          row.isManual &&
          String(row.code || "") === item.code &&
          Number(row.manualHitfactor) === Number(item.hitfactor) &&
          row.date instanceof Date &&
          row.date.toISOString().slice(0, 10) === item.date
        );
        if (duplicate) return;

        const nextIdx = (selection.classifiers || []).reduce((max, row) => Math.max(max, Number(row.idx) || 0), 0) + 1;
        const manualRow = {
          shooterId: selection.id,
          shooterName: selection.name,
          division: normalizeDivision(selection.division),
          date: manualDate,
          hhfPct: Math.max(0, Number(item.hhfPct) || 0),
          code: item.code,
          classifierName: item.classifierName || item.code,
          matchName: `Provisional manual score · HF ${Number(item.hitfactor).toFixed(2)}`,
          idx: nextIdx + 1000000,
          isManual: true,
          manualHitfactor: Number(item.hitfactor),
          hhfValue: Number(item.hhfValue) || null
        };

        selection.classifiers = [...(selection.classifiers || []), manualRow]
          .sort(compareClassifierChronology);
        selection.rankingHistory = computeRollingRankings(selection.classifiers || []);
        state.cache.set(`${selection.id}:${selection.division}`, selection);
      });

      state.pendingManualScores = [];
    }

    function renderManualScorePills() {
      if (!els.manualScorePills) return;
      els.manualScorePills.innerHTML = "";

      const manualEntries = state.selections.flatMap(sel =>
        (sel.classifiers || [])
          .filter(row => row.isManual)
          .map(row => ({ sel, row }))
      );

      if (!manualEntries.length) {
        const empty = document.createElement("div");
        empty.className = "pill";
        empty.textContent = "No manual scores added";
        els.manualScorePills.appendChild(empty);
        return;
      }

      manualEntries
        .sort((a, b) => a.row.date - b.row.date || a.row.idx - b.row.idx)
        .forEach(({ sel, row }) => {
          const pill = document.createElement("div");
          pill.className = "selection-pill";
          const dateText = row.date instanceof Date ? row.date.toISOString().slice(0, 10) : "";
          pill.innerHTML = `<span>${normalizeDisplayName(sel.name)} · ${formatDivisionLabel(sel.division)} · ${row.code} · ${row.hhfPct.toFixed(2)}%${row.manualHitfactor != null ? ` · HF ${row.manualHitfactor.toFixed(2)}` : ""}${dateText ? ` · ${dateText}` : ""}</span>`;
          const btn = document.createElement("button");
          btn.textContent = "Remove";
          btn.addEventListener("click", () => removeManualClassifier(sel, row));
          pill.appendChild(btn);
          els.manualScorePills.appendChild(pill);
        });
    }

    function removeManualClassifier(selection, rowToRemove) {
      selection.classifiers = (selection.classifiers || []).filter(row =>
        !(row.isManual && row.idx === rowToRemove.idx && row.code === rowToRemove.code && row.date.getTime() === rowToRemove.date.getTime())
      );
      selection.rankingHistory = computeRollingRankings(selection.classifiers || []);
      const cacheKey = `${selection.id}:${selection.division}`;
      state.cache.set(cacheKey, selection);
      renderManualScorePills();
      syncUrlState(true);
      render();
      flashStatus(`Removed provisional ${rowToRemove.code} from ${normalizeDisplayName(selection.name)} · ${formatDivisionLabel(selection.division)}.`, "ok");
    }

    function extractClassifierEntries(payload) {
      const direct = findArrayDeep(payload, ["data", "items", "classifiers", "results"]);
      if (Array.isArray(direct) && direct.length) return direct;
      if (payload && typeof payload === "object") return [payload];
      return [];
    }

    async function resolveClassifierDivisionInfo(classifierCode, division) {
      const payload = await fetchJson(`${API_BASE}/v1/classifiers/${encodeURIComponent(classifierCode)}`);
      const entries = extractClassifierEntries(payload)
        .map(row => ({
          ...row,
          division: normalizeDivision(row.division),
          hhfValue: Number(row.hhf_value)
        }))
        .filter(row => row.division === normalizeDivision(division) && Number.isFinite(row.hhfValue));

      const match = entries[0] || null;
      if (!match) {
        throw new Error(`No classifier HHF found for ${classifierCode} in ${formatDivisionLabel(division)}.`);
      }
      return match;
    }

    async function addManualClassifier() {
      const bundleKey = els.manualSelectionSelect?.value || "";
      const selection = findSelectionByBundleKey(bundleKey);
      if (!selection) return flashStatus("Choose a shooter/division to add the provisional score to.", "error");

      const classifierCode = String(els.manualClassifierCode?.value || "").trim().toUpperCase();
      const hitfactor = Number(els.manualHitfactor?.value);
      const inputDate = els.manualClassifierDate?.value || new Date().toISOString().slice(0, 10);

      if (!classifierCode) return flashStatus("Enter a classifier code like 03-02.", "error");
      if (!Number.isFinite(hitfactor) || hitfactor < 0) return flashStatus("Enter a valid hit factor.", "error");

      setLoading(true, "Calculating provisional score...");
      try {
        let classifierInfo;
        try {
          classifierInfo = await resolveClassifierDivisionInfo(classifierCode, selection.division);
        } catch (error) {
          console.error(error);
          flashStatus(`Failed to load classifier HHF for ${classifierCode} in ${formatDivisionLabel(selection.division)}.`, "error");
          return;
        }

        const hhfPct = (hitfactor / classifierInfo.hhfValue) * 100;
        const manualDate = new Date(`${inputDate}T12:00:00`);
        if (Number.isNaN(manualDate.getTime())) throw new Error("Enter a valid date for the provisional score.");

        const nextIdx = (selection.classifiers || []).reduce((max, row) => Math.max(max, Number(row.idx) || 0), 0) + 1;
        const manualRow = {
          shooterId: selection.id,
          shooterName: selection.name,
          division: normalizeDivision(selection.division),
          date: manualDate,
          hhfPct: Math.max(0, hhfPct),
          code: classifierCode,
          classifierName: classifierInfo.name || classifierInfo.title || classifierCode,
          matchName: `Provisional manual score · HF ${hitfactor.toFixed(2)}`,
          idx: nextIdx + 1000000,
          isManual: true,
          manualHitfactor: hitfactor,
          hhfValue: classifierInfo.hhfValue
        };

        selection.classifiers = [...(selection.classifiers || []), manualRow]
          .sort(compareClassifierChronology);
        selection.rankingHistory = computeRollingRankings(selection.classifiers);

        const cacheKey = `${selection.id}:${selection.division}`;
        state.cache.set(cacheKey, selection);

        els.manualClassifierCode.value = "";
        els.manualHitfactor.value = "";
        renderManualScorePills();
        flashStatus(`Added provisional ${classifierCode} at ${hhfPct.toFixed(2)}% to ${normalizeDisplayName(selection.name)} · ${formatDivisionLabel(selection.division)}.`, "ok");
        render();
      } catch (error) {
        console.error(error);
        flashStatus(String(error.message || error), "error");
      } finally {
        setLoading(false, "Loaded");
      }
    }

    function buildShareUrl() {
      const url = new URL(window.location.href);
      url.searchParams.set("tab", state.activeTab);
      if (state.startDate) url.searchParams.set("start", state.startDate); else url.searchParams.delete("start");
      if (state.endDate) url.searchParams.set("end", state.endDate); else url.searchParams.delete("end");
      url.searchParams.set("peak", state.showPeak ? "1" : "0");
      url.searchParams.set("predict", state.showPrediction ? "1" : "0");
      url.searchParams.set("classifiers", state.showClassifierScores ? "1" : "0");
      url.searchParams.set("whatif", state.showWhatIf ? "1" : "0");
      if (state.focusedSeries) url.searchParams.set("focus", encodeURIComponent(state.focusedSeries)); else url.searchParams.delete("focus");
      if (state.targetClassifierCount !== 4) url.searchParams.set("targetn", String(state.targetClassifierCount)); else url.searchParams.delete("targetn");
      if (state.selections.length) {
        const value = state.selections.map(sel => [
          encodeURIComponent(sel.name),
          encodeURIComponent(sel.division),
          encodeURIComponent(String(sel.id || ""))
        ].join("~")).join("|");
        url.searchParams.set("pairs", value);
      } else {
        url.searchParams.delete("pairs");
      }

      const manual = serializeManualScores();
      if (manual) url.searchParams.set("manual", manual); else url.searchParams.delete("manual");

      return url.toString();
    }

    function syncUrlState(replace = true) {
      window.history[replace ? "replaceState" : "pushState"]({}, "", buildShareUrl());
    }

    async function shareCurrentView() {
      const url = buildShareUrl();
      try {
        if (navigator.share) {
          await navigator.share({ title: "Hitfactor USPSA Visualizer", url });
        } else if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(url);
          flashStatus("Share URL copied to clipboard.", "ok");
        } else {
          window.prompt("Copy this URL", url);
        }
      } catch (err) {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(url);
          flashStatus("Share URL copied to clipboard.", "ok");
        }
      }
    }

    function applyUrlState() {
      const params = new URLSearchParams(window.location.search);
      const tab = params.get("tab");
      const start = params.get("start");
      const end = params.get("end");
      const pairs = params.get("pairs");
      const peak = params.get("peak");
      const predict = params.get("predict");
      const classifiers = params.get("classifiers");
      const whatif = params.get("whatif");
      const focus = params.get("focus");
      const targetn = params.get("targetn");
      const manual = params.get("manual");

      if (tab === "elo" || tab === "classifiers") state.activeTab = tab;
      if (start) state.startDate = start;
      if (end) state.endDate = end;

      if (params.has("peak")) state.showPeak = peak === "1";
      if (params.has("predict")) state.showPrediction = predict === "1";
      if (params.has("classifiers")) state.showClassifierScores = classifiers !== "0";
      if (params.has("whatif")) state.showWhatIf = whatif !== "0";

      state.focusedSeries = focus ? decodeURIComponent(focus) : null;
      state.targetClassifierCount = Math.max(1, Number(targetn || state.targetClassifierCount || 4) || 4);

      els.startDate.value = state.startDate;
      els.endDate.value = state.endDate;
      els.showPeakToggle.checked = state.showPeak;
      els.showPredictionToggle.checked = state.showPrediction;
      els.showClassifierScoresToggle.checked = state.showClassifierScores;
      els.showWhatIfToggle.checked = state.showWhatIf;
      if (els.targetClassifierCount) els.targetClassifierCount.value = state.targetClassifierCount;
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.tab === state.activeTab));

      if (pairs) {
        state.selections = pairs.split("|").map(part => {
          const [name, division, id] = part.split("~").map(v => decodeURIComponent(v || ""));
          return { name, division: normalizeDivision(division), id: id ? Number(id) || id : null };
        }).filter(sel => sel.name && sel.division);
      }

      state.pendingManualScores = manual
        ? manual.split("|").map(part => {
            const [id, division, code, hitfactor, date, hhfPct, hhfValue, classifierName] = part.split("~").map(v => decodeURIComponent(v || ""));
            return {
              id: id ? Number(id) || id : id,
              division: normalizeDivision(division),
              code,
              hitfactor: Number(hitfactor),
              date,
              hhfPct: Number(hhfPct),
              hhfValue: Number(hhfValue),
              classifierName
            };
          }).filter(item => item.id && item.division && item.code && item.date)
        : [];
    }

    function clearChart() {
      els.chartContainer.innerHTML = "";
      els.legend.innerHTML = "";
      els.chartContainer.style.height = `${state.chartHeight}px`;
      if (els.whatIfPanel) {
        els.whatIfPanel.innerHTML = "";
        els.whatIfPanel.style.display = "none";
      }
    }

    function getColorScale() {
      const scale = d3.scaleOrdinal();
      state.selections.forEach(sel => {
        const key = seriesKey(sel);
        scale.domain([...scale.domain(), key]).range([...scale.range(), allocateSeriesColor(key)]);
      });
      return scale;
    }

    function buildSvg() {
      const width = els.chartContainer.clientWidth || window.innerWidth - 32;
      const height = state.chartHeight || Math.max(420, window.innerHeight - 32);
      const isMobile = shouldUseTouchViewportLayout();
      const margin = isMobile
        ? { top: 12, right: 32, bottom: 66, left: 42 }
        : { top: 20, right: 64, bottom: 60, left: 68 };
      const svg = d3.create("svg")
        .attr("viewBox", `0 0 ${width} ${height}`)
        .style("width", "100%")
        .style("height", `${height}px`);
      return { svg, width, height, margin };
    }

    function renderLegend(color) {
      els.legend.innerHTML = "";

      state.selections.forEach(sel => {
        const key = seriesKey(sel);
        const focused = isSeriesFocused(key);

        const item = document.createElement("button");
        item.type = "button";
        item.className = "legend-item";
        item.style.opacity = hasFocusedSeries() ? (focused ? "1" : "0.45") : "1";
        item.title = focused ? "Click to clear focus" : "Click to focus";
        item.setAttribute("aria-pressed", focused ? "true" : "false");
        item.innerHTML = `<span class="swatch" style="background:${color(key)}"></span><span>${normalizeDisplayName(sel.name)} · ${formatDivisionLabel(sel.division)}</span>`;
        item.addEventListener("click", () => toggleSeriesFocus(key));
        els.legend.appendChild(item);
      });
    }

    function getTooltip() {
      let tooltip = els.chartContainer.querySelector(".tooltip");
      if (!tooltip) {
        tooltip = document.createElement("div");
        tooltip.className = "tooltip";
        els.chartContainer.appendChild(tooltip);
      }
      return tooltip;
    }

    function showEmpty(message) {
      clearChart();
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = message;
      els.chartContainer.appendChild(empty);
      if (els.whatIfPanel) {
        els.whatIfPanel.style.display = "none";
        els.whatIfPanel.innerHTML = "";
      }
    }

    function renderWhatIfPanel(targetNotes, color) {
      if (!els.whatIfPanel) return;
      els.whatIfPanel.innerHTML = "";
      if (!state.showWhatIf || !targetNotes.length) {
        els.whatIfPanel.style.display = "none";
        return;
      }

      const content = document.createElement("div");
      content.className = "whatif-panel-content";

      targetNotes.forEach(entry => {
        if (!entry.note) return;
        const colorValue = color(entry.key);
        const box = document.createElement("div");
        box.className = "whatif-card";
        box.style.border = `1px solid ${colorValue}`;

        const officialClass = entry.note.currentOfficialClass || "Unknown";
        const calcClass = entry.note.currentPctClass || "U";
        const summaryPrefix = `<strong style="color:${colorValue}">${entry.key}</strong><br>Peak: ${(entry.note.peakRanking ?? 0).toFixed(2)}% (${entry.note.peakClass || "U"})<br>Current: ${(entry.note.currentRanking ?? 0).toFixed(2)}% (${calcClass})<br>Official: ${officialClass}`;

        if (!entry.note.nextClass) {
          box.innerHTML = `${summaryPrefix}<br>Already at top class.`;
        } else if (entry.note.requiredAverage == null) {
          box.innerHTML = `${summaryPrefix}<br>Next ${entry.note.nToAdd} classifiers: target ${entry.note.nextClass} not computable.`;
        } else {
          box.innerHTML = `${summaryPrefix}<br>Need about <strong>${entry.note.requiredAverage.toFixed(2)}%</strong> average over next ${entry.note.nToAdd} unique classifier${entry.note.nToAdd === 1 ? "" : "s"} to reach ${entry.note.nextClass}.`;
        }
        content.appendChild(box);
      });

      if (!content.children.length) {
        els.whatIfPanel.style.display = "none";
        return;
      }

      els.whatIfPanel.appendChild(content);
      els.whatIfPanel.style.display = "block";
    }

    function positionTooltip(event, tooltip) {
      const containerRect = els.chartContainer.getBoundingClientRect();
      const pad = 12;
      tooltip.style.opacity = 1;
      tooltip.style.left = "0px";
      tooltip.style.top = "0px";
      const ttRect = tooltip.getBoundingClientRect();
      let left = event.clientX - containerRect.left + 14;
      let top = event.clientY - containerRect.top - ttRect.height - 14;
      if (left + ttRect.width + pad > containerRect.width) left = event.clientX - containerRect.left - ttRect.width - 14;
      if (left < pad) left = pad;
      if (top < pad) top = event.clientY - containerRect.top + 14;
      if (top + ttRect.height + pad > containerRect.height) top = Math.max(pad, containerRect.height - ttRect.height - pad);
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    function drawPeakLine(svg, data, x, y, color) {
      if (!data.length) return;
      const line = d3.line().curve(d3.curveMonotoneX).x(d => x(d.date)).y(d => y(d.value));
      svg.append("path")
        .datum(data)
        .attr("fill", "none")
        .attr("stroke", color)
        .attr("stroke-width", 1)
        .attr("opacity", 1)
        .attr("d", line);
    }

    function filterPredictionToVisible(data) {
      const start = state.startDate ? new Date(`${state.startDate}T00:00:00`) : null;
      const end = state.endDate ? new Date(`${state.endDate}T23:59:59`) : null;
      return data.filter(d => (!start || d.date >= start) && (!end || d.date <= end));
    }

    function drawPredictionLine(svg, data, x, y, color, lastRealPoint = null, lastRealKey = "value") {
      if (!data.length) return;

      const visible = filterPredictionToVisible(data);
      if (!visible.length) return;

      const historical = visible.filter(d => !d.isProjected);
      const projected = visible.filter(d => d.isProjected);

      const line = d3.line().curve(d3.curveMonotoneX).x(d => x(d.date)).y(d => y(d.value));

      if (historical.length >= 2) {
        svg.append("path")
          .datum(historical)
          .attr("fill", "none")
          .attr("stroke", color)
          .attr("stroke-width", 1.2)
          .attr("opacity", 1)
          .attr("d", line);
      }

      const anchor = lastRealPoint
        ? [{ date: lastRealPoint.date, value: Math.max(0, Number(lastRealPoint[lastRealKey])) }]
        : [];
      const projectedWithAnchor = [...anchor, ...projected];
      if (projectedWithAnchor.length >= 2) {
        svg.append("path")
          .datum(projectedWithAnchor)
          .attr("fill", "none")
          .attr("stroke", color)
          .attr("stroke-width", 1.75)
          .attr("stroke-dasharray", "3 5")
          .attr("opacity", 1)
          .attr("d", line);
      }
    }

    function drawEloTab() {
      const color = getColorScale();
      const series = state.selections.map(sel => {
        const fullValues = sel.eloHistory || [];
        const visibleValues = filterByDate(fullValues);
        const peakValues = state.showPeak ? filterByDate(buildFlatPeakLine(fullValues, "rating")) : [];
        const predictionValues = state.showPrediction ? polynomialPrediction(fullValues, "rating", 12, 5, 9) : [];
        return { key: `${normalizeDisplayName(sel.name)} · ${sel.division}`, values: visibleValues, peakValues, predictionValues };
      }).filter(d => d.values.length);

      if (!series.length) return showEmpty("No ELO history available for the selected shooter/division/date combinations.");

      clearChart();
      renderLegend(color);
      const tooltip = getTooltip();
      const { svg, width, height, margin } = buildSvg();

      const allDates = series.flatMap(s => [...s.values.map(d => d.date), ...s.peakValues.map(d => d.date), ...filterPredictionToVisible(s.predictionValues).map(d => d.date)]);
      const allYValues = series.flatMap(s => [...s.values.map(d => d.rating), ...s.peakValues.map(d => d.value), ...filterPredictionToVisible(s.predictionValues).map(d => d.value)]).filter(Number.isFinite);

      const xDomain = d3.extent(allDates);
      const x = d3.scaleTime().domain(xDomain).range([margin.left, width - margin.right]);
      const y = d3.scaleLinear().domain(d3.extent(allYValues)).nice().range([height - margin.bottom, margin.top]);
      drawYearSeparators(svg, x, height, margin, allDates);

      svg.append("g").attr("class", "grid").attr("transform", `translate(0,${height - margin.bottom})`)
        .call(d3.axisBottom(x).ticks(getBottomAxisInterval()).tickSize(-(height - margin.top - margin.bottom)).tickFormat(() => ""));
      svg.append("g").attr("class", "grid").attr("transform", `translate(${margin.left},0)`)
        .call(d3.axisLeft(y).ticks(6).tickSize(-(width - margin.left - margin.right)).tickFormat(() => ""));
      svg.append("g").attr("class", "axis").attr("transform", `translate(0,${height - margin.bottom})`)
        .call(g => applyBottomAxis(g, x, xDomain));
      svg.append("g").attr("class", "axis").attr("transform", `translate(${margin.left},0)`)
        .call(d3.axisLeft(y).ticks(6));
      svg.append("text").attr("x", width / 2).attr("y", height - (shouldUseTouchViewportLayout() ? 10 : 18)).attr("text-anchor", "middle").attr("font-size", shouldUseTouchViewportLayout() ? "10px" : "12px").text("Date");
      svg.append("text").attr("transform", `translate(18, ${height / 2}) rotate(-90)`).attr("text-anchor", "middle").text("ELO rating");

      const valueLine = d3.line().defined(d => d.rating !== null).x(d => x(d.date)).y(d => y(d.rating));

      series.forEach(serie => {
        svg.append("path").datum(serie.values).attr("fill", "none").attr("stroke", color(serie.key)).attr("stroke-width", getSeriesStrokeWidth(serie.key, 2.5)).attr("opacity", 1).attr("d", valueLine);
        if (state.showPeak) {
          svg.append("g")
            .attr("opacity", 1)
            .call(g => drawPeakLine(g, serie.peakValues, x, y, color(serie.key)));
        }
        if (state.showPrediction) {
          svg.append("g")
            .attr("opacity", 1)
            .call(g => drawPredictionLine(g, serie.predictionValues, x, y, color(serie.key), (serie.values.length ? serie.values[serie.values.length - 1] : null), "rating"));
        }
        svg.append("g").selectAll("circle").data(serie.values).join("circle")
          .attr("cx", d => x(d.date)).attr("cy", d => y(d.rating)).attr("r", 3.25).attr("fill", color(serie.key))
          .on("mousemove", (event, d) => {
            tooltip.innerHTML = `<strong>${normalizeDisplayName(d.shooterName)} · ${formatDivisionLabel(d.division)}</strong><br>${d.date.toISOString().slice(0, 10)}<br>Rating after: ${d.rating.toFixed(2)}${d.ratingBefore !== null ? `<br>Rating before: ${d.ratingBefore.toFixed(2)}` : ""}${d.matchPct !== null ? `<br>Match %: ${d.matchPct.toFixed(2)}` : ""}${d.matchName ? `<br>${d.matchName}` : ""}`;
            positionTooltip(event, tooltip);
          })
          .on("mouseleave", () => tooltip.style.opacity = 0);
      });

      els.chartContainer.appendChild(svg.node());
    }

    function drawClassifierTab() {
      const color = getColorScale();
      const series = state.selections.map(sel => {
        const fullRankings = sel.rankingHistory || [];
        const visibleClassifiers = filterByDate(sel.classifiers || []).sort(compareClassifierChronology);
        const visibleRankings = filterByDate(fullRankings).sort(compareClassifierChronology);
        const peakValues = state.showPeak ? filterByDate(buildFlatPeakLine(fullRankings, "ranking")) : [];
        const predictionValues = state.showPrediction ? polynomialPrediction(fullRankings, "ranking", 12, 5, 12) : [];
        return { key: `${normalizeDisplayName(sel.name)} · ${sel.division}`, classifiers: visibleClassifiers, rankings: visibleRankings, peakValues, predictionValues };
      }).filter(d => d.classifiers.length || d.rankings.length);

      if (!series.length) return showEmpty("No classifier data available for the selected shooter/division/date combinations.");

      clearChart();
      renderLegend(color);
      const tooltip = getTooltip();
      const { svg, width, height, margin } = buildSvg();

      const allDates = series.flatMap(s => [...s.classifiers.map(d => d.date), ...s.rankings.map(d => d.date), ...s.peakValues.map(d => d.date), ...filterPredictionToVisible(s.predictionValues).map(d => d.date)]);
      const allValues = series.flatMap(s => [...s.classifiers.map(d => Math.max(0, d.hhfPct)), ...s.rankings.map(d => Math.max(0, d.ranking)), ...s.peakValues.map(d => Math.max(0, d.value)), ...filterPredictionToVisible(s.predictionValues).map(d => Math.max(0, d.value))]).filter(Number.isFinite);

      const xDomain = d3.extent(allDates);
      const x = d3.scaleTime().domain(xDomain).range([margin.left, width - margin.right]);
      const y = d3.scaleLinear().domain([Math.max(0, d3.min(allValues) - 5), Math.min(120, d3.max(allValues) + 5)]).nice().range([height - margin.bottom, margin.top]);
      drawYearSeparators(svg, x, height, margin, allDates);
      drawClassLines(svg, y, width, margin);

      svg.append("g").attr("class", "grid").attr("transform", `translate(0,${height - margin.bottom})`)
        .call(d3.axisBottom(x).ticks(getBottomAxisInterval()).tickSize(-(height - margin.top - margin.bottom)).tickFormat(() => ""));
      svg.append("g").attr("class", "grid").attr("transform", `translate(${margin.left},0)`)
        .call(d3.axisLeft(y).ticks(6).tickSize(-(width - margin.left - margin.right)).tickFormat(() => ""));
      svg.append("g").attr("class", "axis").attr("transform", `translate(0,${height - margin.bottom})`)
        .call(g => applyBottomAxis(g, x, xDomain));
      svg.append("g").attr("class", "axis").attr("transform", `translate(${margin.left},0)`)
        .call(d3.axisLeft(y).ticks(6).tickFormat(d => `${d}%`));
      drawRightClassAxis(svg, y, width, margin);
      svg.append("text").attr("x", width / 2).attr("y", height - (shouldUseTouchViewportLayout() ? 10 : 18)).attr("text-anchor", "middle").attr("font-size", shouldUseTouchViewportLayout() ? "10px" : "12px").text("Date");
      svg.append("text").attr("transform", `translate(18, ${height / 2}) rotate(-90)`).attr("text-anchor", "middle").text("Classifier HHF % / Calculated USPSA ranking %");

      const rankLine = d3.line().defined(d => d.ranking !== null).x(d => x(d.date)).y(d => y(Math.max(0, d.ranking)));
      const targetNotes = state.selections.map(sel => ({
        key: seriesKey(sel),
        note: requiredAverageForNextClass(sel, state.targetClassifierCount)
      }));

      series.forEach(serie => {
        svg.append("path").datum(serie.rankings).attr("fill", "none").attr("stroke", color(serie.key)).attr("stroke-width", getSeriesStrokeWidth(serie.key, 2.5)).attr("opacity", 1).attr("d", rankLine);
        if (state.showPeak) {
          svg.append("g")
            .attr("opacity", 1)
            .call(g => drawPeakLine(g, serie.peakValues, x, y, color(serie.key)));
        }
        if (state.showPrediction) {
          svg.append("g")
            .attr("opacity", 1)
            .call(g => drawPredictionLine(g, serie.predictionValues, x, y, color(serie.key), (serie.rankings.length ? serie.rankings[serie.rankings.length - 1] : null), "ranking"));
        }

        if (state.showClassifierScores) {
          const calcState = computeClassifierCalcState(serie.classifiers);
          const removedFromCurrentCalc = calcState.removedFromCurrentCalc || [];

          const removedXGroup = svg.append("g")
            .attr("opacity", 1);

          removedXGroup.selectAll("line.removed-a")
            .data(removedFromCurrentCalc)
            .join("line")
            .attr("x1", d => x(d.date) - 6)
            .attr("y1", d => y(d.hhfPct) - 6)
            .attr("x2", d => x(d.date) + 6)
            .attr("y2", d => y(d.hhfPct) + 6)
            .attr("stroke", "rgba(255,255,255,0.95)")
            .attr("stroke-width", 2)
            .style("pointer-events", "none");

          removedXGroup.selectAll("line.removed-b")
            .data(removedFromCurrentCalc)
            .join("line")
            .attr("x1", d => x(d.date) - 6)
            .attr("y1", d => y(d.hhfPct) + 6)
            .attr("x2", d => x(d.date) + 6)
            .attr("y2", d => y(d.hhfPct) - 6)
            .attr("stroke", "rgba(255,255,255,0.95)")
            .attr("stroke-width", 2)
            .style("pointer-events", "none");

          const calcWindow = computeCurrentBestSixWindow(serie.classifiers);
          const currentCalcRows = calcWindow.bestSix || [];
          const currentCalcKeys = new Set(currentCalcRows.map(d => `${d.code}|${d.idx}|${d.date.getTime()}`));
          const thrownOutLowestRows = (calcState.lastEightValid || [])
            .filter(d => !currentCalcKeys.has(`${d.code}|${d.idx}|${d.date.getTime()}`))
            .sort((a, b) => a.hhfPct - b.hhfPct)
            .slice(0, 2);

          svg.append("g").selectAll("circle.thrown-out-lowest-bg").data(thrownOutLowestRows).join("circle")
            .attr("class", "thrown-out-lowest-bg")
            .attr("cx", d => x(d.date))
            .attr("cy", d => y(d.hhfPct))
            .attr("r", 7)
            .attr("fill", "#020617")
            .attr("stroke", "#ffffff")
            .attr("stroke-width", 1)
            .style("pointer-events", "none");

          svg.append("g").selectAll("circle.current-calc-bg").data(currentCalcRows).join("circle")
            .attr("class", "current-calc-bg")
            .attr("cx", d => x(d.date))
            .attr("cy", d => y(d.hhfPct))
            .attr("r", 7)
            .attr("fill", "#020617")
            .attr("stroke", color(serie.key))
            .attr("stroke-width", 1)
            .style("pointer-events", "none");

          svg.append("g").selectAll("circle.classifier").data(serie.classifiers).join("circle")
            .attr("cx", d => x(d.date))
            .attr("cy", d => y(d.hhfPct))
            .attr("r", d => d.isManual ? 5.5 : 4)
            .attr("fill", d => d.isManual ? "#020617" : color(serie.key))
            .attr("stroke", d => d.isManual ? color(serie.key) : "none")
            .attr("stroke-width", d => d.isManual ? 2 : 0)
            .on("mousemove", (event, d) => {
              const removedState = findRemovedClassifierState(serie.classifiers, d);
              const isCurrentCalc = isCurrentCalcPoint(serie.classifiers, d);
              const isThrownOutLowest = thrownOutLowestRows.some(item =>
                item.code === d.code &&
                item.idx === d.idx &&
                item.date.getTime() === d.date.getTime()
              );
              tooltip.innerHTML = `<strong>${normalizeDisplayName(d.shooterName)} · ${formatDivisionLabel(d.division)}</strong><br>${d.date.toISOString().slice(0, 10)}<br>${d.code}${d.classifierName ? ` · ${d.classifierName}` : ""}${d.isManual ? `<br>Manual score` : ""}${isCurrentCalc ? `<br>Used in current calc` : ""}${isThrownOutLowest ? `<br>In most recent valid 8 · thrown out as one of the 2 lowest` : ""}${Number.isFinite(d.hitfactor) ? `<br>Scored HF: ${d.hitfactor.toFixed(2)}` : (Number.isFinite(d.manualHitfactor) ? `<br>Scored HF: ${d.manualHitfactor.toFixed(2)}` : "")}<br>HHF %: ${d.hhfPct.toFixed(2)}${d.matchName ? `<br>${d.matchName}` : ""}${removedState?.replacedBy?.date ? `<br>Removed from current calc · replaced by ${removedState.replacedBy.date.toISOString().slice(0, 10)}` : ""}`;
              positionTooltip(event, tooltip);
            })
            .on("mouseleave", () => tooltip.style.opacity = 0);

          if (isSeriesFocused(serie.key)) {
            const placed = [];
            const labelData = [...serie.classifiers].sort(compareClassifierChronology).map(d => {
              const lx = x(d.date);
              const ly = y(d.hhfPct);
              const label = String(d.code || d.classifierName || "");
              const labelHalfH = Math.max(10, label.length * 3.2);
              const pointBuffer = 12;

              const candidate = {
                x: lx,
                y: Math.max(margin.top + labelHalfH + 4, ly - pointBuffer - labelHalfH),
                halfW: 8,
                halfH: labelHalfH,
                anchor: "middle"
              };

              const last = placed[placed.length - 1];
              if (last && Math.abs(last.x - candidate.x) < (last.halfW + candidate.halfW + 4) &&
                  Math.abs(last.y - candidate.y) < (last.halfH + candidate.halfH + 4)) {
                candidate.y = Math.max(margin.top + labelHalfH + 4, candidate.y - candidate.halfH * 0.75);
              }

              placed.push(candidate);
              return { ...d, labelX: candidate.x, labelY: candidate.y, labelAnchor: candidate.anchor };
            });

            svg.append("g")
              .selectAll("text.classifier-label")
              .data(labelData)
              .join("text")
              .attr("class", "classifier-label")
              .attr("x", d => d.labelX)
              .attr("y", d => d.labelY)
              .attr("text-anchor", d => d.labelAnchor)
              .attr("dominant-baseline", "middle")
              .attr("font-size", "9px")
              .attr("fill", "rgba(255,255,255,0.9)")
              .attr("transform", d => `rotate(-90, ${d.labelX}, ${d.labelY})`)
              .style("pointer-events", "none")
              .text(d => d.code || d.classifierName || "");
          }
        }

        svg.append("g").selectAll("circle.rank").data(serie.rankings).join("circle")
          .attr("cx", d => x(d.date)).attr("cy", d => y(Math.max(0, d.ranking))).attr("r", 2.6).attr("fill", color(serie.key))
          .on("mousemove", (event, d) => {
            tooltip.innerHTML = `<strong>${normalizeDisplayName(d.shooterName)} · ${formatDivisionLabel(d.division)}</strong><br>${d.date.toISOString().slice(0, 10)}<br>Calculated ranking: ${d.ranking.toFixed(2)}%`;
            positionTooltip(event, tooltip);
          })
          .on("mouseleave", () => tooltip.style.opacity = 0);
      });


      els.chartContainer.appendChild(svg.node());
      renderWhatIfPanel(targetNotes, color);
    }

    function render() {
      els.chartContainer.style.height = `${state.chartHeight}px`;
      if (els.whatIfPanel && state.activeTab !== "classifiers") {
        els.whatIfPanel.style.display = "none";
        els.whatIfPanel.innerHTML = "";
      }
      if (!state.selections.length) {
        showEmpty("Add at least one shooter/division pair to begin.");
        setLoading(false, "Loaded");
        return;
      }
      if (state.activeTab === "elo") drawEloTab();
      if (state.activeTab === "classifiers") drawClassifierTab();
      setLoading(false, "Loaded");
    }

    async function hydrateSharedSelections() {
      if (!state.selections.length) return;
      const hydrated = [];
      setLoading(true, "Loading shared view...");
      try {
        for (const selection of state.selections) {
          let resolvedSelection = selection;
          if (selection.id) {
            const refreshed = await resolveShooter(selection.name);
            resolvedSelection = {
              ...selection,
              id: selection.id,
              name: refreshed.name,
              memberNumber: refreshed.memberNumber
            };
          } else {
            const shooter = await resolveShooter(selection.name);
            resolvedSelection = { ...selection, ...shooter, division: selection.division };
          }
          const bundle = await loadShooterDivisionBundle(resolvedSelection);
          hydrated.push(bundle);
        }
        state.selections = hydrated;
        reapplyManualScoresFromUrl();
        renderSelections();
        render();
      } catch (error) {
        console.error(error);
        flashStatus(String(error.message || error), "error");
      } finally {
        setLoading(false, "Loaded");
      }
    }

    let resizeTimer = null;
    let lastResizeWidth = window.innerWidth;

    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const shouldLockChartHeight = shouldUseTouchViewportLayout();
        const widthChanged = window.innerWidth !== lastResizeWidth;
        lastResizeWidth = window.innerWidth;

        if (shouldLockChartHeight) {
          return;
        }

        initChartHeight(widthChanged);
        render();
      }, 80);
    });

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        state.mobileChartHeight = null;
        state.mobileOrientation = null;
        initChartHeight(true);
        render();
      }, 150);
    });

    initControls();
    render();
    hydrateSharedSelections();
  </script>
</body>
</html>
